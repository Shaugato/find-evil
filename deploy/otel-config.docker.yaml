# OpenTelemetry Collector — Docker variant (bind to 0.0.0.0 for cross-container).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 512
    timeout: 2s
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  resource/findevil:
    attributes:
      - key: service.namespace
        value: findevil
        action: upsert

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: findevil
    send_timestamps: true
    metric_expiration: 10m
    enable_open_metrics: true
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/findevil, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/findevil, batch]
      exporters: [prometheus]
