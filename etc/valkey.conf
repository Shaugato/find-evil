# Valkey config for FIND EVIL — /opt/findevil/etc/valkey.conf
#
# Design constraints from the blueprint:
#   - UDS ONLY (port 0). TCP is disabled to keep the blackboard local.
#   - Keyspace events enabled so the MCP server can shadow-publish updates.
#   - AOF on for durability; RDB snapshotting layered on top.

# ─── network ────────────────────────────────────────────────────────────────
port 0
bind 127.0.0.1 -::1
unixsocket /opt/findevil/run/valkey.sock
unixsocketperm 770
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── general ────────────────────────────────────────────────────────────────
daemonize no
supervised systemd
pidfile /opt/findevil/run/valkey.pid
loglevel notice
logfile /opt/findevil/logs/valkey.log
databases 16

# ─── snapshots (RDB) ────────────────────────────────────────────────────────
save 900 1
save 300 10
save 60  10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename findevil.rdb
dir /opt/findevil/data

# ─── AOF (append-only file) ─────────────────────────────────────────────────
appendonly yes
appendfilename "findevil.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── keyspace notifications ─────────────────────────────────────────────────
# K = keyspace events, E = keyevent events, A = all g$lshzxet commands.
# Required by findevil.mcp_server.server._keyspace_notifier → notify_resource_updated.
notify-keyspace-events KEA

# ─── memory ─────────────────────────────────────────────────────────────────
# FIND EVIL's pheromone heatmap is bounded by the (ip,domain,sha,proc) key
# cardinality × decay TTL. 2 GiB is ample for a single-host deployment.
maxmemory 2gb
maxmemory-policy allkeys-lru

# ─── misc ───────────────────────────────────────────────────────────────────
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
# Background expirations run on a worker pool; keep a couple CPUs for the
# pheromone decay service.
io-threads 2
io-threads-do-reads yes
