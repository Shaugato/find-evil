[project]
name = "findevil"
version = "0.1.0"
description = "FIND EVIL: Stigmergic-Blackboard Hybrid for Autonomous DFIR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "FIND EVIL Team" }]
dependencies = [
    # --- Serving / inference ---------------------------------------------------
    # Profile A is the implementation-guide path for 4 GB VRAM. Heavier
    # engines are optional extras below so the base install is reproducible.
    "llama-cpp-python>=0.3,<0.4",
    "outlines>=0.1,<0.2",
    "xgrammar>=0.1",
    "instructor>=1.5,<2.0",
    "guidance>=0.2",
    # --- Orchestration / concurrency ------------------------------------------
    "uvloop>=0.22 ; platform_system!='Windows'",
    "anyio>=4",
    "trio>=0.27",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "aiohttp>=3.10",
    # --- MCP -------------------------------------------------------------------
    "fastmcp>=2.0,<3.0",
    "mcp>=1.10",
    "starlette>=0.41",
    "uvicorn[standard]>=0.34",
    # --- Transport / state -----------------------------------------------------
    "pyzmq>=26",
    "redis[hiredis]>=5.0.6",
    "valkey>=6.0",
    "nats-py>=2.6",
    "msgspec>=0.19",
    "orjson>=3.10",
    # --- Streaming / ingestion -------------------------------------------------
    "bytewax>=0.21",
    # --- Forensic ledger -------------------------------------------------------
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5",
    "uuid-utils>=0.9",
    "blake3>=0.4.1",
    "pynacl>=1.5",
    "cryptography>=42",
    "stix2>=3.0.1",
    "taxii2-client>=2.3.0",
    "sigstore>=3.0",
    "in-toto-attestation>=0.9.3",
    "lmdb>=1.4.1",
    "joserfc>=1.0",
    # --- Debate narrator -------------------------------------------------------
    "langgraph>=0.2,<0.3",
    "dspy-ai>=2.5",
    # --- Observability ---------------------------------------------------------
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-asyncio>=0.48",
    "opentelemetry-exporter-otlp>=1.27",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    # --- Dashboard / UI --------------------------------------------------------
    "textual>=0.85",
    "rich>=13.9",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    # --- Calibration / math ----------------------------------------------------
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    # --- CLI -------------------------------------------------------------------
    "typer>=0.12",
    # --- YARA + forensic libs (Python) -----------------------------------------
    "yara-python>=4.5.2",
    "volatility3>=2.7.0",
    "pefile>=2024.8.26",
    "flare-capa>=8.0.0",
    # 3.1.2 is not published for the current Python 3.12 environment; 3.1.1 is
    # the latest compatible release in the 3.1 line.
    "flare-floss>=3.1.1,<3.2",
    "oletools>=0.60.2",
]

[project.scripts]
findevil = "findevil.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "ruff>=0.7.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6",
]
profile-b = [
    "vllm>=0.12,<0.13 ; platform_system=='Linux'",
]
profile-c = [
    "sglang>=0.4,<0.5 ; platform_system=='Linux'",
]
ollama = [
    "ollama>=0.6,<0.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "ruff>=0.7.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findevil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008", "N818"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running services (valkey, nats, mcp)",
    "e2e: full end-to-end scenario",
    "benchmark: latency benchmark",
    "gpu: requires CUDA GPU",
]
