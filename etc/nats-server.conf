# NATS JetStream config for FIND EVIL — /opt/findevil/etc/nats-server.conf
#
# JetStream streams carry evidence and ledger entries. Accounts split writer
# (ingest, watcher, narrator, cacao) from reader (dashboard, redteam) so a
# compromised reader cannot inject synthetic findings.

server_name: findevil-local
listen: 127.0.0.1:4222
http: 127.0.0.1:8222        # monitoring endpoint; firewall to localhost only

# ─── logging ────────────────────────────────────────────────────────────────
log_file: /opt/findevil/logs/nats.log
logtime: true
debug: false
trace: false
max_traced_msg_len: 256

# ─── jetstream ──────────────────────────────────────────────────────────────
jetstream {
  store_dir: /opt/findevil/data/nats
  max_memory_store: 256MB
  max_file_store: 10GB
  domain: findevil
}

# ─── accounts ───────────────────────────────────────────────────────────────
# Writer: ingest, watcher, narrator, cacao — can publish evidence & findings.
# Reader: dashboard, redteam — consume-only except their own feedback subjects.
accounts {
  WRITER: {
    jetstream: enabled
    users: [
      { user: "findevil_writer", password: "$2a$11$CHANGE_ME_WITH_nats_pass" }
    ]
    exports: [
      { stream: "ledger.v1.>" }
      { stream: "evidence.v1.>" }
    ]
  }
  READER: {
    jetstream: enabled
    users: [
      { user: "findevil_reader", password: "$2a$11$CHANGE_ME_WITH_nats_pass" }
    ]
    imports: [
      { stream: { account: WRITER, subject: "ledger.v1.>" } }
      { stream: { account: WRITER, subject: "evidence.v1.>" } }
    ]
  }
  SYS: { users: [ { user: "sys", password: "$2a$11$CHANGE_ME_WITH_nats_pass" } ] }
}
system_account: SYS

# ─── limits ─────────────────────────────────────────────────────────────────
max_connections: 4096
max_subscriptions: 0
max_payload: 8MB
max_pending: 64MB
write_deadline: "10s"
ping_interval: "2m"
ping_max: 2

# ─── TLS ────────────────────────────────────────────────────────────────────
# Loopback only; TLS is optional on UDS-adjacent localhost traffic. Enable
# mTLS if you expose NATS off-box.
