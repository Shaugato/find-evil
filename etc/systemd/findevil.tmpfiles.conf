# systemd-tmpfiles(5) — FIND EVIL runtime directories.
# Installed to /etc/tmpfiles.d/findevil.conf by bootstrap.sh.
#
# These are re-created on every boot because /run lives on tmpfs. The 0770
# perms keep the ZeroMQ ipc sockets and Valkey UDS accessible only to the
# findevil group (operators) and the findevil user (service account).
d /opt/findevil/run            0770 findevil findevil -
d /opt/findevil/run/zmq        0770 findevil findevil -
d /opt/findevil/run/otel       0770 findevil findevil -
f /opt/findevil/run/inference.lock 0660 findevil findevil -
d /opt/findevil/logs           0770 findevil findevil -

# Persistent data dirs — created once; permissions are re-asserted each boot.
d /opt/findevil/data                0770 findevil findevil -
d /opt/findevil/data/ledger         0770 findevil findevil -
d /opt/findevil/data/quarantine     0770 findevil findevil -
d /opt/findevil/data/calibrators    0770 findevil findevil -
d /opt/findevil/data/yara-rules     0770 findevil findevil -
d /opt/findevil/data/models         0770 findevil findevil -

# Key material: service-owned, group-traversable for operator ledger verify.
d /opt/findevil/etc/keys       0750 findevil findevil -
