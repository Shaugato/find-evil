[supervisord]
nodaemon=true
logfile=/opt/findevil/logs/supervisord.log
pidfile=/opt/findevil/run/supervisord.pid

[program:mcp]
command=findevil mcp
directory=/opt/findevil/repo
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ingest]
command=findevil ingest
directory=/opt/findevil/repo
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:decay]
command=python -m findevil.swarm.decay
directory=/opt/findevil/repo
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
command=findevil dashboard
directory=/opt/findevil/repo
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cacao]
command=findevil cacao
directory=/opt/findevil/repo
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# --- LLM planes: only run when a model is present (ENABLE_LLM=1) --------------
# llama.cpp server + the narrator/watcher that depend on it. With ENABLE_LLM=0
# these stay stopped and the deterministic hot path runs fully without them.
[program:llamacpp]
command=bash -lc 'test -f /opt/findevil/data/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf && exec python -m llama_cpp.server --host 127.0.0.1 --port 8080 --model /opt/findevil/data/models/Llama-3.2-3B-Instruct-Q4_K_M.gguf --model_alias llama-3.2-3b-instruct --n_ctx 2048 --n_threads 4 || (echo "no model; llamacpp disabled"; sleep infinity)'
directory=/opt/findevil/repo
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:narrator]
command=findevil narrator
directory=/opt/findevil/repo
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:watcher]
command=findevil watcher
directory=/opt/findevil/repo
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
